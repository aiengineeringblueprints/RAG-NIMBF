# Issue 16 smoke: gold document IDs for per-sample-context datasets.
# Retrieval-only TechQA run (20 questions) with gold_doc metrics; verifies
# ground_truth_doc_ids are populated and gold hit@k lands in the range of the
# manual reconstruction (doc/enterprise-rag-techqa-refusal-analysis.md, 2.4:
# gold set in top 10 for 91% dense to 97% hybrid).
experiment_name: enterprise-rag-techqa-gold-smoke

dataset:
  name: ragbench
  subset: techqa
  split: train
  sample_size: 20

settings:
  rag_system_adapter: enterprise_rag_mcp
  rag_adapter_accepts: "chunker,embedder"
  benchmark_stage: all
  retrieval_mode: retrieval
  retrieval_strategy: hybrid
  retrieval_hybrid_alpha: 0.5
  retrieval_fetch_k: 50
  retrieval_top_k: 10
  chunking_strategy: recursive
  chunk_size: 512
  chunk_overlap: 128
  retrieval_multihop: false
  retrieval_use_hyde: false
  ragas_enabled: false            # smoke run: no paid RAGAS/critic calls
  custom_metrics_enabled: true    # needed for gold_doc retrieval metrics
  custom_retrieval_metrics_mode: gold_doc
  enterprise_rag_mcp_transport: inprocess
  enterprise_rag_mcp_enabled: false
  enterprise_rag_mcp_apply_settings: true
  enterprise_rag_mcp_query_refinement: false
  enterprise_rag_mcp_guardrails: false
  enterprise_rag_mcp_index_corpus: true
  eval_critic_embedding: ollama:nomic-embed-text:latest

matrix:
  llm_models: [openai:qwen3.8-27b]   # unused in retrieve stage
  embedding_models: [nomic-embed-text:latest]
