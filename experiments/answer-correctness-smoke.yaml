# Issue 45 smoke: custom RAGAS-style answer_correctness judge vs. MLflow's
# built-in Correctness, both judged post-run by a local critic LLM over the
# config run's traces. One internal-pipeline config on 3 SQuAD questions.
# Expect mlflow_judge_answer_correctness_mean and mlflow_judge_correctness_mean
# on the config run; per-trace TP/FP/FN rationales appear as assessments.
# Inspect with: mlflow ui --backend-store-uri sqlite:///mlflow.db
experiment_name: answer-correctness-smoke

dataset:
  name: squad
  subset: null
  sample_size: 3

settings:
  rag_system_adapter: internal
  benchmark_stage: all
  retrieval_mode: retrieval
  retrieval_strategy: similarity
  retrieval_top_k: 4
  retrieval_multihop: false
  retrieval_use_hyde: false
  chunking_strategy: recursive
  chunk_size: 512
  chunk_overlap: 64
  ragas_enabled: false            # direct RAGAS off: only the judge step runs
  custom_metrics_enabled: false
  mlflow_tracing_enabled: true
  eval_critic_llm: ollama:gemma3:12b
  eval_critic_ollama_base_url: http://localhost:11434
  eval_critic_temperature: 0.0
  mlflow_scorers:
    - correctness
    - answer_correctness

matrix:
  llm_models: [openai:qwen3.8-27b]
  embedding_models: [nomic-embed-text:latest]
  prompt_templates: [concise]
  reranker_models: [null]
