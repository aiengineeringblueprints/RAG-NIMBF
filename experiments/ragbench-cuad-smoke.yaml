experiment_name: ragbench-cuad-smoke

# RAGBench CUAD smoke test. CUAD is a legal-domain dataset with long contract
# contexts (~11k tokens per example), making it a stress test for chunking and
# long-context retrieval. Uses N=20 questions from the test split.
#
# Source: rungalileo/ragbench (arXiv:2407.11005)
# Component: cuad (CUAD — legal contracts)
# Split: test (default for RAGBench adapters)
#
# Requires: HuggingFace network access (datasets library). No HF token needed
# for this dataset (public).
dataset:
  name: ragbench_cuad
  split: test
  max_examples: 20

settings:
  rag_system_adapter: internal
  ingestion_method: naive
  ingestion_options_json:
    chunk_token_num: 512

  retrieval_mode: retrieval
  retrieval_top_k: 8
  generation_context_k: 6
  max_new_tokens: 512
  prompt_template: concise
  generation_temperature: 0.0

  custom_retrieval_metrics_mode: gold_doc
  ragas_enabled: false
  custom_metrics_enabled: false
  vector_db_backend: chroma

matrix:
  llm_models:
    - ollama:gpt-oss:20b
  embedding_models:
    - nomic-embed-text:latest
  chunking_strategies:
    - recursive
  chunk_sizes:
    - 512
  chunk_overlaps:
    - 64
  reranker_models:
    - null
