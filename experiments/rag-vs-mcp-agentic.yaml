experiment_name: rag-vs-mcp-agentic

dataset:
  # jsonl-shared indexes corpus_path, the same corpus the MCP server searches.
  name: jsonl-shared
  subset: null
  path: datasets/northstar_facilities/questions.jsonl
  corpus_path: datasets/northstar_facilities/corpus
  sample_size: 20

settings:
  benchmark_stage: all
  retrieval_mode: retrieval
  vector_db_backend: chroma
  retrieval_top_k: 5
  max_new_tokens: 512
  # Pin values that a legacy .env matrix would otherwise inject.
  retrieval_multihop: false
  retrieval_use_hyde: false
  retrieval_strategy: similarity
  dataset_question_field: question
  dataset_ground_truth_field: ground_truth
  eval_critic_llm: ollama:gemma3:12b
  eval_critic_embedding: nomic-embed-text:latest
  custom_retrieval_metrics_mode: gold_doc

  mcp_transport: stdio
  mcp_command: python
  mcp_args_json:
    - examples/corpus_mcp_server.py
    - --corpus
    - datasets/northstar_facilities/corpus
    # Keep in sync with chunk_sizes/chunk_overlaps below so both systems
    # retrieve passages of the same size.
    - --chunk-size
    - "1000"
    - --chunk-overlap
    - "200"
  mcp_execution_mode: agentic
  mcp_allowed_tools_json: [search, lookup]
  mcp_tool_name: search
  mcp_top_k_argument: top_k
  mcp_result_mode: context
  mcp_result_field: contexts
  mcp_max_agent_rounds: 4
  mcp_max_retries: 1
  mcp_continue_on_error: true
  mcp_corpus_path: datasets/northstar_facilities/corpus
  mcp_enforce_fairness: true

matrix:
  rag_system_adapter: [internal, mcp]
  llm_models: [ollama:gemma3:4b]
  embedding_models: [nomic-embed-text:latest]
  chunking_strategies: [recursive]
  chunk_sizes: [1000]
  chunk_overlaps: [200]
  prompt_templates: [concise]
  reranker_models: [null]
