# Issue 44 smoke: post-run MLflow scorers judged by a local critic LLM.
# One internal-pipeline config on 3 SQuAD questions with per-sample tracing.
# After the config run is logged, its traces are scored by MLflow built-in
# judges and RAGAS-via-MLflow scorers using the critic LLM (local Ollama
# gemma3:12b on the Spark). Expect mlflow_judge_<name>_mean metrics on the
# config run next to the (disabled here) direct ragas_* metrics.
# Inspect with: mlflow ui --backend-store-uri sqlite:///mlflow.db
experiment_name: mlflow-scorers-smoke

dataset:
  name: squad
  subset: null
  sample_size: 3

settings:
  rag_system_adapter: internal
  benchmark_stage: all
  retrieval_mode: retrieval
  retrieval_strategy: similarity
  retrieval_top_k: 4
  retrieval_multihop: false
  retrieval_use_hyde: false
  chunking_strategy: recursive
  chunk_size: 512
  chunk_overlap: 64
  ragas_enabled: false            # direct RAGAS off: only the judge step runs
  custom_metrics_enabled: false
  mlflow_tracing_enabled: true
  eval_critic_llm: ollama:gemma3:12b
  eval_critic_ollama_base_url: http://localhost:11434
  mlflow_scorers:
    - retrieval_groundedness
    - retrieval_relevance
    - retrieval_sufficiency
    - correctness
    - relevance_to_query
    - ragas_faithfulness
    - ragas_context_precision
    - ragas_context_recall
    - ragas_factual_correctness

matrix:
  llm_models: [openai:qwen3.8-27b]
  embedding_models: [nomic-embed-text:latest]
  prompt_templates: [concise]
  reranker_models: [null]
