experiment_name: optimaiserag-northstar-smoke

# Five-question connectivity and contract check. The complete corpus is still
# uploaded so retrieval behavior matches the full benchmark.
dataset:
  name: jsonl-shared
  subset: null
  sample_size: 5
  path: datasets/northstar_facilities/questions.jsonl
  corpus_path: datasets/northstar_facilities/corpus

settings:
  rag_system_adapter: optimaiserag
  rag_managed_api_key_env: OPTIMAISE_RAG_API_KEY
  rag_managed_request_timeout_seconds: 60
  rag_managed_poll_interval_seconds: 2
  rag_managed_poll_timeout_seconds: 1800
  rag_managed_reuse_resources: true
  rag_managed_cleanup: false
  rag_managed_dataset_prefix: northstar-smoke

  ingestion_method: naive
  ingestion_options_json:
    chunk_token_num: 256

  retrieval_mode: retrieval
  retrieval_top_k: 10
  retrieval_candidate_k: 1024
  retrieval_similarity_threshold: 0.2
  retrieval_vector_similarity_weight: 0.3
  retrieval_keyword_enabled: true

  generation_context_k: 6
  generation_temperature: 0.0
  generation_top_p: 1.0
  generation_presence_penalty: 0.0
  generation_frequency_penalty: 0.0
  max_new_tokens: 512
  prompt_template: concise

  custom_retrieval_metrics_mode: gold_doc
  ragas_enabled: false
  custom_metrics_enabled: false
  vector_db_backend: chroma

matrix:
  # These identifiers must exist in your optimiseRAG deployment.
  llm_models:
    - qwen2.5:7b
  embedding_models:
    - BAAI/bge-m3
  chunking_strategies:
    - provider
  reranker_models:
    - null
