# Issue 42 smoke: MLflow Tracing with one trace per sample.
# Two internal-pipeline configs (similarity + multi-hop + rerank, hybrid +
# rerank; the hybrid path ignores retrieval_multihop) on
# 3 SQuAD questions. Every sample must produce one trace with exactly one
# RETRIEVER span holding the generator's contexts, linked to its config run.
# Inspect with: mlflow ui --backend-store-uri sqlite:///mlflow.db
# (RAG-Benchmark experiment → Traces tab, or the config run → Traces).
experiment_name: mlflow-tracing-smoke

dataset:
  name: squad
  subset: null
  sample_size: 3

settings:
  rag_system_adapter: internal
  benchmark_stage: all
  retrieval_mode: retrieval
  retrieval_top_k: 4
  retrieval_hybrid_alpha: 0.5
  retrieval_multihop: true
  retrieval_multihop_rounds: 2
  retrieval_use_hyde: false
  reranker_top_k: 3
  chunking_strategy: recursive
  chunk_size: 512
  chunk_overlap: 64
  ragas_enabled: false            # smoke run: no paid RAGAS/critic calls
  custom_metrics_enabled: false
  mlflow_tracing_enabled: true

matrix:
  llm_models: [openai:qwen3.8-27b]
  embedding_models: [nomic-embed-text:latest]
  prompt_templates: [concise]
  retrieval_strategy: [similarity, hybrid]
  reranker_models: [huggingface:cross-encoder/ms-marco-MiniLM-L-6-v2]
